name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build all targets
    # macOS is the only host that can build every target: darwin needs the
    # Apple SDK, linux/windows are cross-compiled with zig.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # router.mod is upstream's go.mod plus sing-box, so it has the highest
      # Go requirement of the two flavors.
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/router.mod
          cache-dependency-path: native/router.sum

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - run: npm ci

      - name: Build
        run: npm run build:full

      # Runs with the router binary (the router package is installed in the
      # workspace), including the config drift checks that need the submodule.
      - name: Test
        run: npm test

      - name: Test core binary
        run: npm test -w masterdnsvpn-node
        env:
          MASTERDNSVPN_NODE_FLAVOR: core

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          retention-days: 1
          path: |
            packages/core/dist
            packages/core/binaries
            packages/router/dist
            packages/router/binaries

  test:
    name: Test ${{ matrix.os }} (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: packages

      - run: npm test

      - name: Test core binary
        run: npm test -w masterdnsvpn-node
        env:
          MASTERDNSVPN_NODE_FLAVOR: core

  e2e:
    name: End-to-end (proxy + TUN, Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: actions/setup-go@v5
        with:
          go-version-file: MasterDnsVPN/go.mod
          cache-dependency-path: MasterDnsVPN/go.sum

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: packages

      - run: ./e2e/run.sh
