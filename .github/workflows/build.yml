name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build all targets
    # macOS is the only host that can build every target: darwin needs the
    # Apple SDK, linux/windows are cross-compiled with zig.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: actions/setup-go@v5
        with:
          go-version-file: MasterDnsVPN/go.mod
          cache-dependency-path: MasterDnsVPN/go.sum

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - run: npm ci

      - name: Build
        run: npm run build:full

      # Also runs the config type drift check, which needs the submodule.
      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          retention-days: 1
          path: |
            dist
            binaries

  test:
    name: Test ${{ matrix.os }} (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - run: npm test
